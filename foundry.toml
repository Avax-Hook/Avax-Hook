[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "v4-core/=lib/v4-core/src/",
  "solmate/=lib/v4-core/lib/solmate/",
  "permit2/=lib/v4-periphery/lib/permit2/",
]
auto_detect_remappings = false
fs_permissions = [
  { access = "read", path = "./script/stock-feeds.json" },
  { access = "write", path = "./script/signed-feeds.json" },
  { access = "read", path = "./script/v2-state.json" },
  { access = "read", path = "./script/v3-modules.json" },
  { access = "read-write", path = "./script/v3-state.json" },
  { access = "write", path = "./script/house-coins-v2.json" },
  { access = "read-write", path = "./script/pools-state.json" },
  { access = "read-write", path = "./cache/pools-state.fork.json" },
  { access = "read-write", path = "./script/pools-state.retired-v1.json" },
  { access = "read-write", path = "./cache/pools-state.retired-v1.fork.json" },
]

[rpc_endpoints]
avalanche = "${AVALANCHE_RPC_URL}"
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
